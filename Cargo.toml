[package]
name = "myanmar-date"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Conversion between Gregorian and Myanmar (Burmese) lunisolar calendar dates, ported from yan9a/mmcal."
repository = "https://github.com/yannaing/mmdate"
documentation = "https://docs.rs/myanmar-date"
readme = "README.md"
keywords = ["myanmar", "burmese", "calendar", "date", "lunisolar"]
categories = ["date-and-time", "no-std", "internationalization"]
exclude = ["util/", ".claude/", "Claude.md", "tests/fixtures/"]

[dependencies]
chrono = { version = "0.4", default-features = false, optional = true }

[dev-dependencies]
proptest = "1"

[features]
default = ["chrono"]
chrono = ["dep:chrono"]
burmese = []
std = []

[package.metadata.docs.rs]
all-features = true
